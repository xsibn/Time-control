<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Учёт рабочего времени</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0f1420" />
<link rel="icon" href="/icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Учёт времени" />
<style>
  :root { --bg:#0f1420; --panel:#161d2e; --accent:#4f8cff; --text:#eef1f8; --muted:#8a94ab; --border:#262f45; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
  }
  h1 { font-size: 20px; margin-bottom: 6px; text-align: center; color: var(--muted); font-weight: 600; }
  .who { font-size: 13px; color: var(--muted); margin-bottom: 22px; text-align: center; }
  .cards { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 340px; }
  a.card, button.card {
    display: block; background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; color: var(--text); text-decoration: none; text-align: left; cursor: pointer; font-family: inherit;
  }
  a.card .t, button.card .t { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  a.card .d, button.card .d { font-size: 13px; color: var(--muted); }

  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    align-items: center; justify-content: center; padding: 20px; z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 22px; width: 100%; max-width: 340px;
  }
  .modal h2 { font-size: 16px; margin: 0 0 16px; }
  .modal input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); padding: 10px 12px; font-size: 14px; font-family: inherit; margin-bottom: 10px;
  }
  .modal .msg { font-size: 13px; margin-bottom: 10px; min-height: 16px; }
  .modal .msg.error { color: #ff5470; }
  .modal .msg.ok { color: #34c77b; }
  .modal-actions { display: flex; gap: 10px; margin-top: 4px; }
  .modal-actions button {
    flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
    background: transparent; color: var(--text); cursor: pointer; font-family: inherit; font-size: 14px;
  }
  .modal-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  .install-hint {
    width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; display: none;
    align-items: center; gap: 12px;
  }
  .install-hint.show { display: flex; }
  .install-hint .icon {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
  }
  .install-hint .body { flex: 1; min-width: 0; }
  .install-hint .t { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .install-hint .d { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .install-hint .actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .install-hint button {
    font-family: inherit; font-size: 12px; padding: 7px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  }
  .install-hint .btn-install { border: none; background: var(--accent); color: #fff; font-weight: 600; }
  .install-hint .btn-dismiss { border: 1px solid var(--border); background: transparent; color: var(--muted); }
</style>
</head>
<body>
  <h1>УЧЁТ РАБОЧЕГО ВРЕМЕНИ</h1>
  <div class="who" id="who"></div>

  <div class="install-hint" id="installHint">
    <img class="icon" src="/icons/icon-192.png" alt="" />
    <div class="body">
      <div class="t">Установите приложение</div>
      <div class="d" id="installHintText">Работает быстрее и без адресной строки браузера</div>
    </div>
    <div class="actions">
      <button class="btn-install" id="installBtn" onclick="doInstall()">Установить</button>
      <button class="btn-dismiss" onclick="dismissInstallHint()">Не сейчас</button>
    </div>
  </div>

  <div class="cards" id="cards">Загрузка…</div>

  <div class="overlay" id="pwOverlay">
    <div class="modal">
      <h2>Сменить пароль</h2>
      <input type="password" id="pwCurrent" placeholder="Текущий пароль" autocomplete="current-password" />
      <input type="password" id="pwNew" placeholder="Новый пароль (мин. 6 символов)" autocomplete="new-password" />
      <input type="password" id="pwNew2" placeholder="Повторите новый пароль" autocomplete="new-password" />
      <div class="msg" id="pwMsg"></div>
      <div class="modal-actions">
        <button onclick="closePasswordModal()">Отмена</button>
        <button class="primary" onclick="submitPasswordChange()">Сохранить</button>
      </div>
    </div>
  </div>

<script>
async function init() {
  const resp = await fetch('/api/auth/me');
  const cards = document.getElementById('cards');
  const who = document.getElementById('who');

  if (!resp.ok) {
    who.textContent = 'Вы не авторизованы';
    cards.innerHTML = `
      <a class="card" href="/login.html">
        <div class="t">🔑 Войти / зарегистрироваться</div>
        <div class="d">Вход для охраны или регистрация сотрудника</div>
      </a>`;
    return;
  }

  const user = await resp.json();
  const roleLabel = { guard: 'охрана', admin: 'администратор', employee: 'сотрудник' }[user.role] || user.role;
  who.textContent = `${user.full_name} · ${roleLabel}`;

  if (user.role === 'guard') {
    cards.innerHTML = `
      <a class="card" href="/guard.html">
        <div class="t">🛡️ Экран охранника</div>
        <div class="d">Показывает QR-код, обновляется каждую минуту</div>
      </a>
      <button class="card" onclick="logout()">
        <div class="t">🚪 Выйти</div>
      </button>`;
  } else if (user.role === 'admin') {
    cards.innerHTML = `
      <a class="card" href="/admin.html">
        <div class="t">👤 Сотрудники</div>
        <div class="d">Список зарегистрированных сотрудников</div>
      </a>
      <a class="card" href="/logs.html">
        <div class="t">📋 Журнал</div>
        <div class="d">Приход, уход и отработанное время по сменам</div>
      </a>
      <a class="card" href="/admin.html">
        <div class="t">📊 Экспорт в Excel</div>
        <div class="d">Выбрать период и скачать таблицу</div>
      </a>
      <button class="card" onclick="openPasswordModal()">
        <div class="t">🔒 Сменить пароль</div>
      </button>
      <button class="card" onclick="logout()">
        <div class="t">🚪 Выйти</div>
      </button>`;
  } else {
    cards.innerHTML = `
      <a class="card" href="/scan.html">
        <div class="t">📷 Отметить приход/уход</div>
        <div class="d">Сканировать QR-код на посту охраны</div>
      </a>
      <button class="card" onclick="openPasswordModal()">
        <div class="t">🔒 Сменить пароль</div>
      </button>
      <button class="card" onclick="logout()">
        <div class="t">🚪 Выйти</div>
      </button>`;
  }
}

async function logout() {
  await fetch('/api/auth/logout', { method: 'POST' });
  location.href = '/login.html';
}

function openPasswordModal() {
  document.getElementById('pwCurrent').value = '';
  document.getElementById('pwNew').value = '';
  document.getElementById('pwNew2').value = '';
  document.getElementById('pwMsg').textContent = '';
  document.getElementById('pwMsg').className = 'msg';
  document.getElementById('pwOverlay').classList.add('open');
}

function closePasswordModal() {
  document.getElementById('pwOverlay').classList.remove('open');
}

async function submitPasswordChange() {
  const current_password = document.getElementById('pwCurrent').value;
  const new_password = document.getElementById('pwNew').value;
  const new_password2 = document.getElementById('pwNew2').value;
  const msg = document.getElementById('pwMsg');

  if (!current_password || !new_password) {
    msg.textContent = 'Заполните все поля';
    msg.className = 'msg error';
    return;
  }
  if (new_password !== new_password2) {
    msg.textContent = 'Пароли не совпадают';
    msg.className = 'msg error';
    return;
  }
  if (new_password.length < 6) {
    msg.textContent = 'Новый пароль должен быть не короче 6 символов';
    msg.className = 'msg error';
    return;
  }

  const resp = await fetch('/api/auth/change-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ current_password, new_password }),
  });
  const data = await resp.json().catch(() => ({}));

  if (!resp.ok) {
    msg.textContent = data.error || 'Не удалось сменить пароль';
    msg.className = 'msg error';
    return;
  }

  msg.textContent = 'Пароль изменён';
  msg.className = 'msg ok';
  setTimeout(closePasswordModal, 1200);
}

init();
</script>
<script>
// --- Подсказка об установке PWA (показывается один раз) ---
const INSTALL_HINT_KEY = 'installHintDismissed';
let deferredInstallPrompt = null;

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function isIos() {
  return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
}

function maybeShowInstallHint() {
  if (isStandalone()) return; // уже установлено — не показываем
  if (localStorage.getItem(INSTALL_HINT_KEY)) return; // уже показывали раньше

  const hint = document.getElementById('installHint');
  const installBtn = document.getElementById('installBtn');
  const text = document.getElementById('installHintText');

  if (isIos()) {
    // На iOS нет системного диалога установки — только ручная инструкция через "Поделиться"
    text.textContent = 'Нажмите «Поделиться» → «На экран Домой»';
    installBtn.style.display = 'none';
    hint.classList.add('show');
  } else if (deferredInstallPrompt) {
    text.textContent = 'Работает быстрее и без адресной строки браузера';
    hint.classList.add('show');
  }
  // Если deferredInstallPrompt ещё не пришёл (Android/desktop Chrome) — покажем,
  // как только сработает событие beforeinstallprompt (см. ниже).
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  maybeShowInstallHint();
});

async function doInstall() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  dismissInstallHint();
}

function dismissInstallHint() {
  document.getElementById('installHint').classList.remove('show');
  localStorage.setItem(INSTALL_HINT_KEY, '1');
}

window.addEventListener('appinstalled', () => {
  localStorage.setItem(INSTALL_HINT_KEY, '1');
});

// Для iOS событие beforeinstallprompt не существует — показываем инструкцию сразу
if (isIos()) maybeShowInstallHint();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
