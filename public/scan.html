<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Моя отметка — приход/уход</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0c0f16" />
<link rel="icon" href="/icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Учёт времени" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="/css/theme.css" />
<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 0 16px 40px;
  }
  h1 { font-size: 17px; font-weight: 700; margin: 14px 0 4px; text-align: center; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; text-align: center; }
  #reader {
    width: 100%; max-width: 380px; border-radius: 20px; overflow: hidden;
    border: 1px solid var(--border); background: #000;
  }
  #result {
    margin-top: 20px; width: 100%; max-width: 380px; min-height: 100px;
    background: var(--panel); border-radius: 20px; padding: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; border: 1px solid var(--border); transition: border-color 0.2s;
  }
  #result.ok { border-color: var(--green); }
  #result.err { border-color: var(--red); }
  #result .name { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  #result .action { font-size: 15px; margin-bottom: 2px; }
  #result .action.in { color: var(--green); }
  #result .action.out { color: var(--red); }
  #result .time { color: var(--muted); font-size: 13px; }
  #result .hint { color: var(--muted); font-size: 14px; }
  .error-box {
    max-width: 380px; text-align: center; color: var(--red); padding: 30px 16px; font-size: 15px;
  }
</style>
</head>
<body>
  <div id="app"></div>

<script>
  const app = document.getElementById('app');

  async function init() {
    const resp = await fetch('/api/auth/me');
    if (!resp.ok) { location.href = '/login.html'; return; }
    const user = await resp.json();
    if (user.role !== 'employee') { location.href = '/login.html'; return; }

    app.innerHTML = `
      <header class="app-header" style="width:100%;max-width:380px;margin-bottom:8px;">
        <a class="brand" href="/index.html">
          <img class="mark" src="/icons/icon-192.png" alt="" />
          <div>
            <div class="name">Моя отметка</div>
            <div class="who">${escapeHtml(user.full_name)}</div>
          </div>
        </a>
        <nav class="app-nav"><button class="logout-btn" onclick="logout()">Выйти</button></nav>
      </header>
      <div class="eyebrow"><span class="dot"></span>Камера активна</div>
      <h1>Отсканируйте QR на посту охраны</h1>
      <div class="sub">Код меняется каждую минуту — наведите камеру на экран охранника</div>
      <div id="reader"></div>
      <div id="result"><div class="hint">Наведите камеру на QR-код</div></div>
    `;
    initScanner();
  }

  async function logout() {
    await fetch('/api/auth/logout', { method: 'POST' });
    location.href = '/login.html';
  }

  function initScanner() {
    const resultEl = document.getElementById('result');
    let busy = false;

    async function submitPayload(payload) {
      if (busy) return;
      busy = true;
      try {
        const resp = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ payload }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          if (resp.status === 401) { location.href = '/login.html'; return; }
          showError(data.error || 'Ошибка');
        } else {
          showSuccess(data);
        }
      } catch (e) {
        showError('Нет связи с сервером');
      } finally {
        setTimeout(() => { busy = false; }, 2000);
      }
    }

    function showSuccess(data) {
      const time = new Date(data.timestamp.replace(' ', 'T') + 'Z')
        .toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      resultEl.className = 'ok';
      resultEl.innerHTML = `
        <div class="name">${escapeHtml(data.full_name)}</div>
        <div class="action ${data.type}">${data.type === 'in' ? 'ПРИХОД ЗАСЧИТАН ✓' : 'УХОД ЗАСЧИТАН ✓'}</div>
        <div class="time">${time}</div>
      `;
      resetAfterDelay();
    }

    function showError(msg) {
      resultEl.className = 'err';
      resultEl.innerHTML = `<div class="hint">${escapeHtml(msg)}</div>`;
      resetAfterDelay();
    }

    function resetAfterDelay() {
      setTimeout(() => {
        resultEl.className = '';
        resultEl.innerHTML = '<div class="hint">Наведите камеру на QR-код</div>';
      }, 3500);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const qr = new Html5Qrcode('reader');
    Html5Qrcode.getCameras().then((cameras) => {
      if (!cameras || !cameras.length) {
        document.getElementById('reader').innerHTML =
          '<div style="color:#8a94ab;padding:40px;text-align:center;">Камера не найдена</div>';
        return;
      }
      const camId = cameras.find(c => /back|rear|environment/i.test(c.label))?.id || cameras[cameras.length - 1].id;
      qr.start(
        camId,
        { fps: 10, qrbox: { width: 240, height: 240 } },
        (decodedText) => submitPayload(decodedText),
        () => {}
      );
    }).catch(() => {
      document.getElementById('reader').innerHTML =
        '<div style="color:#8a94ab;padding:40px;text-align:center;">Нет доступа к камере</div>';
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  init();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
