<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Вход — учёт рабочего времени</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0f1420" />
<link rel="icon" href="/icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Учёт времени" />
<style>
  :root { --bg:#0f1420; --panel:#161d2e; --accent:#4f8cff; --text:#eef1f8; --muted:#8a94ab; --border:#262f45; --red:#ff5470; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .box { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 26px; }
  h1 { font-size: 18px; margin: 0 0 18px; text-align: center; color: var(--muted); font-weight: 600; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: #0f1420; padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
  .tabs button {
    flex: 1; padding: 10px; border: none; border-radius: 9px; background: transparent; color: var(--muted);
    font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .tabs button.active { background: var(--accent); color: white; }
  form { display: none; flex-direction: column; gap: 12px; }
  form.active { display: flex; }
  input {
    padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: #0f1420; color: var(--text); font-size: 15px; width: 100%;
    color-scheme: dark;
  }
  label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block; }
  button.submit {
    padding: 13px; border-radius: 10px; border: none; background: var(--accent);
    color: white; font-weight: 700; cursor: pointer; font-size: 15px; margin-top: 4px;
  }
  .error { color: var(--red); font-size: 13px; text-align: center; min-height: 18px; }
</style>
</head>
<body>
  <div class="box">
    <h1>УЧЁТ РАБОЧЕГО ВРЕМЕНИ</h1>
    <form id="loginForm" class="active">
      <div>
        <label>Логин</label>
        <input type="text" id="loginLogin" autocomplete="username" required />
      </div>
      <div>
        <label>Пароль</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required />
      </div>
      <button class="submit" type="submit">Войти</button>
      <div class="error" id="loginError"></div>
    </form>

  </div>

<script>
function redirectByRole(role) {
  if (role === 'guard') { location.href = '/guard.html'; return; }
  if (role === 'admin') { location.href = '/admin.html'; return; }
  location.href = '/scan.html';
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  const resp = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      login: document.getElementById('loginLogin').value.trim(),
      password: document.getElementById('loginPassword').value,
    }),
  });
  const data = await resp.json();
  if (!resp.ok) { errEl.textContent = data.error || 'Ошибка входа'; return; }
  redirectByRole(data.role);
});

// Если уже авторизован — сразу отправляем на нужную страницу
fetch('/api/auth/me').then(r => r.ok ? r.json() : null).then(user => {
  if (user) redirectByRole(user.role);
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
