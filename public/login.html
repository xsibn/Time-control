<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Вход — учёт рабочего времени</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0c0f16" />
<link rel="icon" href="/icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Учёт времени" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />
<link rel="stylesheet" href="/css/theme.css" />
<style>
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .box { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 30px 26px; position: relative; overflow: hidden; }
  .box::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-strong));
  }
  .mark { width: 48px; height: 48px; border-radius: 13px; margin: 0 auto 16px;
    display: block; object-fit: cover; }
  h1 { font-size: 15px; margin: 0 0 22px; text-align: center; color: var(--text); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; background: var(--bg); padding: 4px; border-radius: 12px; border: 1px solid var(--border); }
  .tabs button {
    flex: 1; padding: 10px; border: none; border-radius: 9px; background: transparent; color: var(--muted);
    font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .tabs button.active { background: var(--accent); color: var(--accent-ink); }
  form { display: none; flex-direction: column; gap: 12px; }
  form.active { display: flex; }
  input {
    padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 15px; width: 100%;
    color-scheme: dark;
  }
  label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block; }
  button.submit {
    padding: 13px; border-radius: 10px; border: none; background: var(--accent);
    color: var(--accent-ink); font-weight: 700; cursor: pointer; font-size: 15px; margin-top: 4px;
  }
  .error { color: var(--red); font-size: 13px; text-align: center; min-height: 18px; }
</style>
</head>
<body>
  <div class="box">
    <img class="mark" src="/icons/icon-192.png" alt="" />
    <h1>Учёт рабочего времени</h1>
    <form id="loginForm" class="active">
      <div>
        <label>Логин</label>
        <input type="text" id="loginLogin" autocomplete="username" required />
      </div>
      <div>
        <label>Пароль</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required />
      </div>
      <button class="submit" type="submit">Войти</button>
      <div class="error" id="loginError"></div>
    </form>

  </div>

<script>
function redirectByRole(role) {
  if (role === 'guard') { location.href = '/guard.html'; return; }
  if (role === 'admin') { location.href = '/admin.html'; return; }
  location.href = '/scan.html';
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  const resp = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      login: document.getElementById('loginLogin').value.trim(),
      password: document.getElementById('loginPassword').value,
    }),
  });
  const data = await resp.json();
  if (!resp.ok) { errEl.textContent = data.error || 'Ошибка входа'; return; }
  redirectByRole(data.role);
});

// Если уже авторизован — сразу отправляем на нужную страницу
fetch('/api/auth/me').then(r => r.ok ? r.json() : null).then(user => {
  if (user) redirectByRole(user.role);
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
